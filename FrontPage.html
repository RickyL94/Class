<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to System Automation</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: #08090d;
    color: #fcee09;
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Background */
.background {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(8,9,13,.7), rgba(8,9,13,.9)),
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 49px,
            rgba(0,240,255,.08) 50px
        ),
        repeating-linear-gradient(
            90deg,
            transparent,
            transparent 49px,
            rgba(0,240,255,.08) 50px
        );
    animation: backgroundMove 15s linear infinite;
}

@keyframes backgroundMove {
    from { background-position: 0 0; }
    to { background-position: 100px 100px; }
}

/* Scanlines */
.scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        transparent 0px,
        rgba(0,0,0,.15) 2px,
        transparent 4px
    );
    z-index: 5;
}

/* Main content */
.container {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: fadeIn 2s ease forwards;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Ravensbourne logo (animated SVG/HTML, no PNG) */
.logo {
    margin-bottom: 40px;
    display: inline-block;
    animation: logoAppear 1.2s ease forwards;
    opacity: 0;
}

@keyframes logoAppear {
    to { opacity: 1; }
}

.logo svg {
    width: 320px;
    height: 120px;
}

/* Icon parts */
.logo .square {
    fill: none;
    stroke: #fcee09;
    stroke-width: 2;
    stroke-dasharray: 320;
    stroke-dashoffset: 320;
    animation: drawSquare 1.5s ease forwards;
}

@keyframes drawSquare {
    to { stroke-dashoffset: 0; }
}

.logo .diagonal {
    fill: none;
    stroke: #00f0ff;
    stroke-width: 2;
    stroke-dasharray: 120;
    stroke-dashoffset: 120;
    animation: drawDiagonal 1.2s ease forwards 1.5s;
}

@keyframes drawDiagonal {
    to { stroke-dashoffset: 0; }
}

.logo .circle {
    fill: #888;
    animation: pulse 2s infinite alternate;
}

.logo .c1 { animation-delay: 0s; }
.logo .c2 { animation-delay: 0.3s; }
.logo .c3 { animation-delay: 0.6s; }

@keyframes pulse {
    0% { r: 1; opacity: 0.4; }
    50% { r: 2.4; opacity: 1; }
    100% { r: 1; opacity: 0.4; }
}

/* Text within logo */
.logo text {
    font-family: 'Orbitron', sans-serif;
}

.logo .text-main {
    font-weight: 900;
    font-size: 26px;
    fill: #fcee09;
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: textFade 1s ease forwards 1.8s;
    opacity: 0;
}

.logo .text-sub {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 400;
    font-size: 15px;
    fill: #00f0ff;
    letter-spacing: 1px;
    animation: textFade 1s ease forwards 2.2s;
    opacity: 0;
}

@keyframes textFade {
    to { opacity: 1; }
}

/* Subtitle */
.subtitle {
    color: #00f0ff;
    letter-spacing: 12px;
    font-size: 14px;
    margin-bottom: 30px;
    text-transform: uppercase;
    animation: flicker 3s infinite;
}

/* h1 */
h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(55px, 12vw, 130px);
    font-weight: 900;
    text-transform: uppercase;
    color: #fcee09;
    text-shadow:
        4px 4px 0 #ff003c,
        -4px -4px 0 #00f0ff,
        0 0 30px rgba(252,238,9,.7);
    position: relative;
    animation: glitch 3s infinite;
}

@keyframes glitch {
    0%, 90%, 100% {
        transform: translate(0);
    }
    92% {
        transform: translate(-4px, 2px);
    }
    94% {
        transform: translate(4px, -2px);
    }
    96% {
        transform: translate(-2px, 0);
    }
}

@keyframes flicker {
    0%, 19%, 21%, 23%, 80%, 100% { opacity: 1; }
    20%, 22%, 81% { opacity: .3; }
}

/* Description */
.description {
    margin-top: 35px;
    color: #ccc;
    font-size: 20px;
    letter-spacing: 5px;
    text-transform: uppercase;
}

/* Line */
.line {
    height: 2px;
    width: 0;
    background: #00f0ff;
    margin: 30px auto;
    box-shadow: 0 0 15px #00f0ff;
    animation: expand 2s ease forwards 1s;
}

@keyframes expand {
    to { width: 250px; }
}

/* Footer */
.footer {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    text-align: center;
    color: #555;
    letter-spacing: 4px;
    font-size: 11px;
    z-index: 3;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="scanlines"></div>

<div class="container">
    <!-- Ravensbourne logo as animated HTML/SVG (no PNG) -->
    <div class="logo">
        <svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
            <g class="icon" transform="translate(20, 20)">
                <rect class="square" x="0" y="0" width="80" height="80"></rect>
                <line class="diagonal" x1="0" y1="0" x2="80" y2="80"></line>
                <circle class="circle c1" cx="20" cy="20" r="6"></circle>
                <circle class="circle c2" cx="50" cy="40" r="10"></circle>
                <circle class="circle c3" cx="35" cy="60" r="4"></circle>
            </g>
            <text class="text-main" x="115" y="55">RAVENSBOURNE</text>
            <text class="text-sub" x="115" y="82">University London</text>
        </svg>
    </div>

    

    <h1>WELCOME TO SYSTEM AUTOMATION</h1>

    <div class="line"></div>

    

    <div class="description">
        Level 4, Week 7 - Week 12
    </div><div class="footer">
        CYBER SECURITY // BUSINESS COMPUTING // 2026
    </div>
</div>



</body></html>
