```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Night City</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: #08090d;
    color: #fcee09;
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Background */
.background {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(8,9,13,.7), rgba(8,9,13,.9)),
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 49px,
            rgba(0,240,255,.08) 50px
        ),
        repeating-linear-gradient(
            90deg,
            transparent,
            transparent 49px,
            rgba(0,240,255,.08) 50px
        );
    animation: backgroundMove 15s linear infinite;
}

@keyframes backgroundMove {
    from { background-position: 0 0; }
    to { background-position: 100px 100px; }
}

/* Scanlines */
.scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        transparent 0px,
        rgba(0,0,0,.15) 2px,
        transparent 4px
    );
    z-index: 5;
}

/* Main content */
.container {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: fadeIn 2s ease forwards;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.subtitle {
    color: #00f0ff;
    letter-spacing: 12px;
    font-size: 14px;
    margin-bottom: 30px;
    text-transform: uppercase;
    animation: flicker 3s infinite;
}

h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(55px, 12vw, 130px);
    font-weight: 900;
    text-transform: uppercase;
    color: #fcee09;
    text-shadow:
        4px 4px 0 #ff003c,
        -4px -4px 0 #00f0ff,
        0 0 30px rgba(252,238,9,.7);
    position: relative;
    animation: glitch 3s infinite;
}

@keyframes glitch {
    0%, 90%, 100% {
        transform: translate(0);
    }
    92% {
        transform: translate(-4px, 2px);
    }
    94% {
        transform: translate(4px, -2px);
    }
    96% {
        transform: translate(-2px, 0);
    }
}

@keyframes flicker {
    0%, 19%, 21%, 23%, 80%, 100% { opacity: 1; }
    20%, 22%, 81% { opacity: .3; }
}

.description {
    margin-top: 35px;
    color: #ccc;
    font-size: 20px;
    letter-spacing: 5px;
    text-transform: uppercase;
}

.line {
    height: 2px;
    width: 0;
    background: #00f0ff;
    margin: 30px auto;
    box-shadow: 0 0 15px #00f0ff;
    animation: expand 2s ease forwards 1s;
}

@keyframes expand {
    to { width: 250px; }
}

.button {
    display: inline-block;
    margin-top: 20px;
    padding: 14px 45px;
    border: 2px solid #fcee09;
    color: #fcee09;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-decoration: none;
    transition: .3s;
    cursor: pointer;
    background: transparent;
}

.button:hover {
    background: #fcee09;
    color: #08090d;
    box-shadow: 0 0 30px #fcee09;
}

.footer {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    text-align: center;
    color: #555;
    letter-spacing: 4px;
    font-size: 11px;
    z-index: 3;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="scanlines"></div>

<div class="container">
    <div class="subtitle">Night City // 2077</div>

    <h1>WELCOME</h1>

    <div class="line"></div>

    <div class="description">
        Wake up, Samurai.
    </div>

    <button class="button" onclick="enterCity()">
        ENTER NIGHT CITY
    </button>
</div>

<div class="footer">
    SYSTEM ONLINE // ARASAKA NETWORK // 2077
</div>

<script>
function enterCity() {
    document.body.style.transition = "filter 1s, opacity 1s";
    document.body.style.filter = "brightness(3)";
    document.body.style.opacity = "0";

    setTimeout(() => {
        document.body.style.filter = "none";
        document.body.style.opacity = "1";
        alert("WELCOME TO NIGHT CITY, SAMURAI.");
    }, 1000);
}
</script>

</body>
</html>
```
